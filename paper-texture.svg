<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="table" tableValues="0 0.055"/>
    </feComponentTransfer>
  </filter>
  <rect width="240" height="240" fill="#fbf8f1"/>
  <rect width="240" height="240" filter="url(#paper)" opacity="0.35"/>
</svg>
